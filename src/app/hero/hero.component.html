<div class="container-fluid hero-bg">
    <div class="container">
        <div class="row" style="height: 90vh;">
            <div class="col-md-6" style="display: flex; justify-content: center; align-items: left; flex-direction: column;">
                <h1 class="hero-title" [class.blurred-text]="currentMoon" (mouseover)="unblurMoon(false)">Lost in digital dillemas?</h1>
                <h1 class="hero-subtitle" [class.blurred-text]="!currentMoon" (mouseover)="unblurMoon(true)">Emerge into the light with
                    <span class="highlight">Night Work IT</span> solutions.</h1>
            </div>
            <div class="col-md-6" style="display: flex; justify-content: center; ">
                <div class="moon" [class.moon-active]="currentMoon" style="flex-grow: 0; flex-shrink: 0;">
                    <div class="star-1"></div>
                    <div class="star-2"></div> 
                  </div>
            </div>
        </div>
    </div>
</div>
