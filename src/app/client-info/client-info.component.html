<section class="stats">
  <div class="stats-container">
    <div class="stat-row">
      @for (stat of stats; track stat.label; let i = $index) {
        <div class="stat-cell">
          <div class="stat-num" #statNum [attr.data-idx]="i">
            {{ stat.format(stat.current) }}<span class="unit">{{ stat.suffix }}</span>
          </div>
          <div class="stat-label">{{ stat.label }}</div>
          <div class="stat-meta">{{ stat.meta }}</div>
        </div>
      }
    </div>
  </div>
</section>
